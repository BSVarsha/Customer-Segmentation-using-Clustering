<!DOCTYPE html>
<html>
<head>
    <title>Login | Customer App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="login-container">
    
    <div class="login-card">
        <div class="sidebar-header" style="justify-content: center; margin-bottom: 30px;">
            <i class="fas fa-users-gear logo-icon" style="font-size: 32px;"></i>
            <h2 style="font-size: 1.75rem;">Customer App</h2>
        </div>
        
        <h1 style="font-size: 1.5rem; margin-bottom: 5px;">Welcome Back</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Please enter your details to sign in</p>

        <form action="/login" method="post">

            <div class="input-group">
                <input type="text" name="username" placeholder=" " required>
                <label><i class="fas fa-user"></i> Username</label>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder=" " required>
                <label><i class="fas fa-lock"></i> Password</label>
            </div>

            <button type="submit" class="primary-btn" style="margin-top: 20px;">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>

        </form>

        <p class="link">New here? 
            <a href="/register">Create an account</a>
        </p>

    </div>

</div>

</body>
</html>
