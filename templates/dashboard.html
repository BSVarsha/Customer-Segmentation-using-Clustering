<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Customer App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-users-gear logo-icon"></i>
            <h2>Customer App</h2>
        </div>
        <ul>
            <li><a href="/dashboard" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/dashboard"><i class="fas fa-magnifying-glass"></i> Predict</a></li>
            <li><a href="/logout" class="logout-link"><i class="fas fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="main-inner">
            
            <div class="header-section">
                <h1>Customer Segmentation Dashboard</h1>
                <p>Enter customer details to analyze segment distribution.</p>
            </div>

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-pill">
                    <span class="label">Total Customers:</span>
                    <span class="val">2,540</span>
                </div>
                <div class="stat-pill">
                    <span class="label">Avg. Income:</span>
                    <span class="val">$60.5k</span>
                </div>
                <div class="stat-pill">
                    <span class="label">Avg. Score:</span>
                    <span class="val">50.2</span>
                </div>
            </div>

            <div class="dashboard-grid">
                <!-- Left: Form -->
                <div class="grid-item">
                    <div class="form-card">
                        <div class="card-header">
                            <h2><i class="fas fa-user-plus"></i> Analyze Customer</h2>
                        </div>

                        <form action="/predict" method="post">
                            <div class="input-group">
                                <input type="number" name="age" min="18" max="100" placeholder=" " required>
                                <label>Age (18-100)</label>
                            </div>

                            <div class="input-group">
                                <input type="number" name="income" min="1" max="1000000" step="0.1" placeholder=" " required>
                                <label>Annual Income (e.g. 45 for $45,000)</label>
                            </div>

                            <div class="input-group">
                                <input type="number" name="score" min="1" max="100" placeholder=" " required>
                                <label>Spending Score (1-100)</label>
                            </div>

                            <button type="submit" class="primary-btn">
                                <i class="fas fa-bolt"></i> Run Analysis
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right: Chart -->
                <div class="grid-item">
                    <div class="chart-card">
                        <div class="card-header">
                            <h2><i class="fas fa-chart-pie"></i> Segment Distribution</h2>
                        </div>
                        <div class="chart-container">
                            <canvas id="segmentChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    const ctx = document.getElementById('segmentChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Premium', 'Budget', 'Careful', 'Impulsive', 'Average'],
            datasets: [{
                data: [20, 15, 25, 30, 10],
                backgroundColor: ['#00c6ff', '#0072ff', '#3b82f6', '#6366f1', '#a855f7'],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { color: '#94a3b8', padding: 20, font: { family: "'Inter', sans-serif", size: 11 } }
                }
            },
            cutout: '70%'
        }
    });
</script>

</body>
</html>
